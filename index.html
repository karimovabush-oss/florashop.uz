<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora shop.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FFF8F9; --bg2:#F9DCE4; --ink:#5A1235; --muted:#8A5A70;
  --wine:#85154E; --wine-ink:#FFF8F9; --card:#FFFFFF; --line:#E9BFCE; --focus:#85154E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2B0B1D; --bg2:#42142D; --ink:#FBE3EA; --muted:#D9A9BC;
    --wine:#F2B8CB; --wine-ink:#4A0D2B; --card:#3A1226; --line:#6A2A4A; --focus:#F2B8CB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2B0B1D; --bg2:#42142D; --ink:#FBE3EA; --muted:#D9A9BC;
  --wine:#F2B8CB; --wine-ink:#4A0D2B; --card:#3A1226; --line:#6A2A4A; --focus:#F2B8CB;
  color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh;
  background:var(--bg1) linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
  color:var(--ink);
  font-family:"Jost","Helvetica Neue",Arial,sans-serif; font-size:17px; line-height:1.4;
  display:flex; justify-content:center;
}
main{width:100%; max-width:440px; padding:44px 22px 40px; text-align:center}
.logo{
  width:148px; height:148px; border-radius:50%; display:block; margin:0 auto 22px;
  box-shadow:0 0 0 6px var(--bg1), 0 0 0 7px var(--line), 0 14px 30px rgba(90,18,53,.18);
  animation:bloom .9s ease-out both;
}
@keyframes bloom{from{opacity:0; transform:scale(.88)}to{opacity:1; transform:none}}
h1{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
  font-size:64px; line-height:1; margin:0; letter-spacing:.01em; color:var(--wine);
}
.domain{font-family:"Cormorant Garamond",Georgia,serif; font-size:24px; margin:4px 0 0; color:var(--ink); letter-spacing:.06em}
.tagline{margin:18px auto 34px; max-width:30ch; color:var(--muted)}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.btn{
  display:flex; align-items:center; gap:16px; text-align:left;
  padding:15px 20px; border-radius:18px; text-decoration:none;
  background:var(--card); color:var(--ink); border:1px solid var(--line);
  transition:transform .15s ease, box-shadow .15s ease;
}
a.btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(90,18,53,.14)}
a.btn:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
a.btn.main{background:var(--wine); color:var(--wine-ink); border-color:var(--wine); padding:19px 20px}
a.btn svg{flex:none; width:26px; height:26px}
.t{display:block; font-weight:500; font-size:18px}
.s{display:block; font-size:15px; opacity:.78}
footer{margin-top:34px; font-size:14px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){
  .logo{animation:none} a.btn{transition:none} a.btn:hover{transform:none}
}
</style>
</head>
